const $ = (q,root=document)=>root.querySelector(q);
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const state={id:location.hash.slice(1).split('/')[0]||'arquitectura',tab:'Negocio',query:''};

const flow=()=>DB.flows.find(x=>x.id===state.id)||DB.flows[0];
function tag(cls){return `<span class="tag ${esc(cls)}">${esc(cls)}</span>`}
function nav(){const q=state.query.toLocaleLowerCase();const found=DB.flows.filter(f=>!q||[f.title,f.id,...f.refs.flatMap(m=>[m.cls,m.method,m.signature])].join(' ').toLocaleLowerCase().includes(q));$('#nav').innerHTML=found.map(f=>`<button data-id="${f.id}" class="${f.id===state.id?'active':''}"><span class="icon">${esc(f.icon)}</span>${esc(f.title)}</button>`).join('')||'<div class="empty">Sin resultados</div>';$('#navcount').textContent=`${found.length} flujos · ${DB.classCount} clases · ${DB.methodCount} métodos enlazados`;$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>select(b.dataset.id));}
function select(id,tab){state.id=id;state.tab=tab||'Negocio';location.hash=id;render();window.scrollTo(0,0)}
function paragraphs(items){return items.map(x=>`<p>${esc(x)}</p>`).join('')}
function panel(title,items){return `<section class="card"><h2>${esc(title)}</h2>${paragraphs(items)}</section>`}
function syntax(s){const tok=/\/\/[^\n]*|"(?:\\.|[^"\\])*"|\b(?:public|private|protected|static|final|class|new|return|if|else|for|try|catch|throw|throws|void|int|boolean|String|ArrayList|this|super|null|true|false)\b|\b\d+\b/g;let out='',last=0,m;while((m=tok.exec(s))){out+=esc(s.slice(last,m.index));let type=m[0].startsWith('//')?'com':m[0].startsWith('"')?'str':/^\d/.test(m[0])?'num':'kw';out+=`<span class="${type}">${esc(m[0])}</span>`;last=tok.lastIndex}return out+esc(s.slice(last))}
function methodCard(m,i){const pkg=m.cls.split('.')[0];return `<article class="method" id="method-${i}"><div class="method-head"><div>${tag(pkg)}<h3>${esc(m.cls)}.${esc(m.method)}</h3><div class="path">${esc(m.signature)}</div></div><a href="../../${esc(m.path)}#L${m.line}" title="Abrir fuente Java">${esc(m.path)}:${m.line} ↗</a></div><div class="method-info"><div><b>Participación</b>${esc(m.why)}</div><div><b>Invocado por</b>${esc(m.caller)}</div><div><b>Invoca después</b>${esc(m.next)}</div></div><pre class="code"><code>${syntax(m.snippet)}</code></pre></article>`}
function codePanel(f){const q=state.query.toLocaleLowerCase();let refs=f.refs.map((m,i)=>({...m,i}));if(q)refs=refs.filter(m=>[m.cls,m.method,m.signature,m.why].join(' ').toLocaleLowerCase().includes(q));return `<div class="card"><h2>Métodos del flujo</h2><p>Fragmentos literales de los archivos Java actuales. La línea del enlace identifica el comienzo del método; los bloques muestran sus primeras líneas.</p><div class="method-links">${f.refs.map((m,i)=>`<button data-jump="method-${i}">${esc(m.cls.split('.').at(-1))}.${esc(m.method)}</button>`).join('')}</div></div>${refs.map(m=>methodCard(m,m.i)).join('')||'<div class="empty">Ningún método del flujo coincide con la búsqueda.</div>'}`}
function svgEl(name,attrs={},value){const e=document.createElementNS('http://www.w3.org/2000/svg',name);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(value!=null)e.textContent=value;return e}
function addText(svg,x,y,value,size=12,color='#d7e7f8',anchor='middle'){svg.append(svgEl('text',{x,y,'font-size':size,fill:color,'text-anchor':anchor,'font-family':'Segoe UI,Arial,sans-serif'},value))}
function sequence(svg,edges){let names=[];for(const [a,b] of edges){if(!names.includes(a))names.push(a);if(!names.includes(b))names.push(b)}const w=Math.max(620,names.length*158+90),h=edges.length*48+115;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.dataset.baseW=w;svg.dataset.baseH=h;names.forEach((name,i)=>{let x=65+i*158;svg.append(svgEl('rect',{x:x-56,y:15,width:112,height:35,rx:8,fill:'#203a57',stroke:'#4a7ca3'}));addText(svg,x,37,name,12);svg.append(svgEl('line',{x1:x,y1:51,x2:x,y2:h-18,stroke:'#375b79','stroke-dasharray':'4 5'}))});edges.forEach(([a,b,label],i)=>{let x1=65+names.indexOf(a)*158,x2=65+names.indexOf(b)*158,y=88+i*48;svg.append(svgEl('line',{x1,y1:y,x2,y2:y,stroke:'#72c9e8','stroke-width':2}));let dir=x2>=x1?1:-1;svg.append(svgEl('path',{d:`M ${x2-dir*7} ${y-5} L ${x2} ${y} L ${x2-dir*7} ${y+5}`,fill:'none',stroke:'#72c9e8','stroke-width':2}));addText(svg,(x1+x2)/2,y-9,label,11,'#e4effc')})}
function flowchart(svg,nodes,edges){const labels=Object.fromEntries(nodes),pos={};let left=260,right=555;nodes.forEach(([id],i)=>pos[id]={x:id==='X'?right:left,y:42+i*65});const w=810,h=nodes.length*65+75;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.dataset.baseW=w;svg.dataset.baseH=h;edges.forEach(([a,b,label])=>{const p=pos[a],q=pos[b],x1=p.x,y1=p.y+21,x2=q.x,y2=q.y-21;svg.append(svgEl('path',{d:`M ${x1} ${y1} C ${x1} ${(y1+y2)/2} ${x2} ${(y1+y2)/2} ${x2} ${y2}`,fill:'none',stroke:'#589ac2','stroke-width':1.7}));svg.append(svgEl('path',{d:`M ${x2-5} ${y2-7} L ${x2} ${y2} L ${x2+5} ${y2-7}`,fill:'none',stroke:'#589ac2','stroke-width':1.7}));if(label)addText(svg,(x1+x2)/2+12,(y1+y2)/2-4,label,10,'#f9c86b')});nodes.forEach(([id,label])=>{const p=pos[id],width=220;svg.append(svgEl('rect',{x:p.x-width/2,y:p.y-21,width,height:42,rx:10,fill:id==='X'?'#493145':'#1e3854',stroke:id==='X'?'#c47f95':'#5388ae'}));addText(svg,p.x,p.y+4,label,12)})}
function diagram(title,mermaid,kind,data){const id=`diag-${kind}`;return `<div class="diagram"><div class="diagram-head"><strong>${esc(title)}</strong><button data-zoom="${id}" data-d="-1" aria-label="Alejar">−</button><button data-zoom="${id}" data-d="1" aria-label="Acercar">+</button><button data-reset="${id}">100 %</button><button data-source="${id}">Mermaid</button></div><div class="canvas"><svg id="${id}" role="img" aria-label="${esc(title)}"></svg></div><pre class="mermaid-source" id="${id}-source">${esc(mermaid)}</pre></div>`}
function renderDiagrams(f){sequence($('#diag-seq'),f.seq);flowchart($('#diag-flow'),f.flow,f.edges);document.querySelectorAll('.diagram svg').forEach(svg=>{svg.dataset.zoom='1';svg.style.width=svg.dataset.baseW+'px';svg.style.height=svg.dataset.baseH+'px'});document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>{let s=$('#'+b.dataset.zoom);let z=Math.max(.5,Math.min(2.5,Number(s.dataset.zoom)+(Number(b.dataset.d)*.25)));s.dataset.zoom=z;s.style.width=s.dataset.baseW*z+'px';s.style.height=s.dataset.baseH*z+'px'});document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{let s=$('#'+b.dataset.reset);s.dataset.zoom=1;s.style.width=s.dataset.baseW+'px';s.style.height=s.dataset.baseH+'px'});document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>$('#'+b.dataset.source+'-source').classList.toggle('show'))}
function technical(f){return panel('Recorrido técnico',f.technical)+diagram('Diagrama de secuencia',f.sequenceMermaid,'seq',f.seq)+diagram('Diagrama de flujo',f.flowMermaid,'flow',f.flow)+`<p><a href="../flujos/${f.id}.md">Abrir Markdown completo ↗</a></p>`}
function architecture(){let html='<section class="card"><h2>Índice de tipos y dependencias</h2><p>Inventario de todos los archivos Java productivos. Los vínculos proceden de los import explícitos del código; los tipos del mismo paquete pueden llamarse sin import.</p><div class="inventory">';for(const [pkg,classes] of Object.entries(DB.inventory)){html+=`<div class="inv">${tag(pkg)}<div>${classes.map(esc).join(' · ')}</div></div>`}html+='</div></section><section class="card"><h2>Mapa de clases</h2><p>Abre un paquete para ver qué clases importan sus archivos.</p>';for(const [pkg,classes] of Object.entries(DB.inventory)){html+=`<details><summary>${esc(pkg)} · ${classes.length} tipos</summary><ul>`;for(const cls of classes){let deps=DB.dependencies[`Biblioteca/src/${pkg}/${cls}.java`]||[];html+=`<li><strong>${esc(cls)}</strong> → ${deps.length?deps.map(esc).join(', '):'sin import interno explícito'}</li>`}html+='</ul></details>'}return html+'</section>'}
function render(){let f=flow();state.id=f.id;nav();let content=`<div class="eyebrow">Flujo ${DB.flows.indexOf(f)+1} de ${DB.flows.length} · ${esc(f.layer)}</div><h1 class="title">${esc(f.title)}</h1><p class="intro">Sigue el comportamiento implementado desde el evento Swing hasta la colección y los archivos. Las referencias enlazan al código Java del repositorio.</p><div class="meta">${tag(f.layer)}<span class="pill">${f.refs.length} métodos clave</span><span class="pill">2 diagramas</span><a class="pill" href="../flujos/${f.id}.md">Markdown ↗</a></div><div class="tabs" role="tablist">${tabs.map(t=>`<button role="tab" aria-selected="${t===state.tab}" data-tab="${t}" class="${t===state.tab?'active':''}">${t}</button>`).join('')}</div><div class="panel" role="tabpanel">`;
switch(state.tab){case'Negocio':content+=panel('Perspectiva de negocio',f.business)+(f.id==='arquitectura'?architecture():'');break;case'Técnica':content+=technical(f);break;case'Código':content+=codePanel(f);break;case'Datos':content+=panel('Datos y persistencia',f.data);break;case'Depuración':content+=panel('Recorrido en IntelliJ',f.debug);break;case'Pruebas':content+=panel('Pruebas existentes y pendientes',f.tests);break}content+='</div>';$('#content').innerHTML=content;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>$('#'+b.dataset.jump)?.scrollIntoView({behavior:'smooth'}));if(state.tab==='Técnica')renderDiagrams(f)}
$('#search').addEventListener('input',e=>{state.query=e.target.value;nav();if(state.tab==='Código')render()});window.addEventListener('hashchange',()=>{const id=location.hash.slice(1).split('/')[0];if(DB.flows.some(f=>f.id===id)){state.id=id;render()}});render();
</script>
</body>
</html>
